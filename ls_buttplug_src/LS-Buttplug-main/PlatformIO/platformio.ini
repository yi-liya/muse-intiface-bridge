; ================== BUILD TARGET SELECTION ==================
; Select ONE board to build:
; 1) Uncomment the required [env:...]
; 2) Comment out all other [env:...] sections
;
; Available targets:
; - esp32        → Generic ESP32 (esp32dev)
; - esp32c3      → ESP32-C3 DevKitM-1
; - seeed        → Seeed XIAO ESP32-C3
; - esp32-s3     → ESP32-S3 DevKitC-1
;
; Example:
;   To build for Seeed XIAO ESP32-C3, uncomment [env:seeed_xiao_esp32c3]
;   and comment out [env:esp32] and [env:esp32c3]
; ============================================================

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
; NimBLE 用本地 lib/NimBLE-Arduino-2.3.7（不走 registry 下载）

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; NimBLE 用本地 lib/NimBLE-Arduino-2.3.7（不走 registry 下载）

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
; NimBLE 用本地 lib/NimBLE-Arduino-2.3.7（不走 registry 下载）

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; NimBLE 用本地 lib/NimBLE-Arduino-2.3.7（不走 registry 下载）
; 强制 USJ 硬件 CDC (PID_4001): 板子复位后串口不断, esptool 随时可 reset 进下载;
; 否则 TinyUSB/OTG (PID_1001) 会把 USJ 从 USB 切走, 只能物理按键进下载模式
build_flags = -DARDUINO_USB_MODE=1
; 原生 USB(USJ)口烧录: 用 usb_reset 进下载模式
upload_flags = --before=usb_reset
